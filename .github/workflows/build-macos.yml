name: build-kodex-macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build kodex-cli (macosArm64)
        run: ./gradlew :app-cli:linkReleaseExecutableMacosArm64 --no-configuration-cache --console=plain

      - name: Locate binary
        run: find app -name '*.kexe' -type f

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kodex-macos-arm64
          path: app/cli/build/bin/macosArm64/releaseExecutable/kodex-cli.kexe
          if-no-files-found: error
